        background:var(--primario,#011D62);color:#fff;
        font-family:"Inter",sans-serif;font-weight:900;font-size:38px;letter-spacing:2px;
        padding:16px 30px 16px 56px;border-radius:0 14px 14px 0;
      }
      #tag-taladro{
        position:absolute;bottom:430px;right:0;
        background:#07080c;color:#fff;border-right:10px solid var(--secundario,#0382F7);
        font-family:"Inter",sans-serif;font-weight:900;font-size:36px;letter-spacing:2px;
        padding:16px 46px 16px 30px;border-radius:14px 0 0 14px;
      }

      .centro{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
      #precio-grupo{top:640px}
      #marca-grupo{top:820px}

      .barra{width:300px;height:14px;background:var(--secundario,#0382F7);border-radius:999px}
      #barra-precio{margin:22px 0 20px}
      #barra-marca{margin:0 0 26px}

      #precio{font-family:"Montserrat",sans-serif;font-weight:900;letter-spacing:-4px;font-size:196px;line-height:.92;color:#fff;letter-spacing:-3px}
      #bajada-precio{font-family:"Inter",sans-serif;font-weight:800;font-size:42px;letter-spacing:2px;
        color:var(--secundario,#0382F7);text-align:center;text-shadow:4px 4px 0 #07080c,-4px -4px 0 #07080c,0 4px 22px rgba(0,0,0,.9)}
      #marca{font-family:"Montserrat",sans-serif;font-weight:900;letter-spacing:-3px;font-size:124px;line-height:1;color:#fff;text-transform:uppercase;letter-spacing:1px}
      #bajada-marca{font-family:"Inter",sans-serif;font-weight:800;font-size:48px;letter-spacing:3px;color:var(--secundario,#0382F7);margin-top:20px;
        text-shadow:3px 3px 0 #07080c,-3px -3px 0 #07080c,0 4px 20px rgba(0,0,0,.85)}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cierre" data-duration="3.2" data-width="1080" data-height="1920">
      <div id="capa" class="clip" data-start="0" data-duration="3.2">
        <div id="velo" class="clip"></div>

        <div id="tag-sin" data-var-text="tagIzq">SIN SER CARPINTERO</div>
        <div id="precio-grupo" class="centro">
          <div id="precio" data-var-text="precio" class="contorno">$11.000</div>
          <div id="barra-precio" class="barra"></div>
          <div id="bajada-precio" data-var-text="bajadaPrecio">TABLAS + CONECTORES IMPRESOS</div>
        </div>
        <div id="tag-taladro" data-var-text="tagDer">UN TALADRO Y LISTO</div>

        <div id="marca-grupo" class="centro">
          <div id="barra-marca" class="barra" style="background:var(--acento,#FB830F)"></div>
          <div id="marca" data-var-text="marca" class="contorno">Next Layer</div>
          <div id="bajada-marca" data-var-text="bajadaMarca">IMPRESIÓN 3D</div>
        </div>
      </div>
    </div>

    <script>
      // Cada video trae sus textos desde el plan (npm run cierre -- --plan ...).
      // Lo que venga vacío no va: una etiqueta sin texto sería una pastilla de
      // color vacía en pantalla. Se lee una vez, antes de armar la línea de tiempo.
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const ocultarSiVacio = (id, clave) => {
        const valor = vars[clave];
        if (typeof valor === 'string' && !valor.trim()) document.getElementById(id).style.display = 'none';
      };
      ocultarSiVacio('tag-sin', 'tagIzq');
      ocultarSiVacio('tag-taladro', 'tagDer');
      ocultarSiVacio('bajada-precio', 'bajadaPrecio');
      if (typeof vars.precio === 'string' && !vars.precio.trim()) {
        document.getElementById('precio-grupo').style.display = 'none';
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({paused: true});
      window.__timelines['cierre'] = tl;

      // Estados iniciales por GSAP: si el CSS fija un transform y GSAP anima esa
      // misma propiedad, el primer frame puede salir con el valor equivocado.
      gsap.set('#tag-sin',      {x: -560, opacity: 0});
      gsap.set('#tag-taladro',  {x:  560, opacity: 0});
      gsap.set('#precio',       {scale: 1.5, opacity: 0, filter: 'blur(16px)'});
      gsap.set('#barra-precio', {scaleX: 0, transformOrigin: 'left center'});
      gsap.set('#bajada-precio',{y: 34, opacity: 0});
      gsap.set('#marca-grupo',  {opacity: 0});
      gsap.set('#barra-marca',  {scaleX: 0, transformOrigin: 'left center'});
      gsap.set('#marca',        {y: 90, scale: 0.82, opacity: 0});
      gsap.set('#bajada-marca', {y: 40, opacity: 0});

      // 0,00-0,35  el mueble respira. El reveal es la toma, no la grafica.
      // 0,35       entra la esquina de arriba: abre el movimiento por el borde.
      tl.to('#tag-sin', {x: 0, opacity: 1, duration: 0.30, ease: 'power3.out'}, 0.18)
        // 0,32  aterriza el precio. back.out hace el asentamiento del sello en
        //       un solo tween; encadenar varios sobre scale se pisa en los bordes.
        .to('#precio', {scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.48, ease: 'back.out(1.5)'}, 0.32)
        .to('#barra-precio', {scaleX: 1, duration: 0.26, ease: 'power3.out'}, 0.58)
        .to('#bajada-precio', {y: 0, opacity: 1, duration: 0.30, ease: 'power2.out'}, 0.70)
        // 0,86  la esquina de abajo cierra la diagonal con la de arriba.
        .to('#tag-taladro', {x: 0, opacity: 1, duration: 0.30, ease: 'power3.out'}, 0.86)

        // 1,85  todo se va HACIA ARRIBA. Las esquinas salen por donde entraron,
        //       cada una a su borde: el cuadro se vacia hacia afuera, no se apaga.
        .to('#tag-sin',     {x: -560, opacity: 0, duration: 0.32, ease: 'power3.in'}, 1.85)
        .to('#tag-taladro', {x:  560, opacity: 0, duration: 0.32, ease: 'power3.in'}, 1.89)
        .to('#precio-grupo',{y: -200, scale: 0.86, opacity: 0, duration: 0.40, ease: 'power3.in'}, 1.85)

        .to('#velo', {opacity: 1, duration: 0.45, ease: 'power2.out'}, 1.90)
        .to('#marca-grupo', {opacity: 1, duration: 0.01}, 2.04)
        .to('#barra-marca', {scaleX: 1, duration: 0.28, ease: 'power3.out'}, 2.06)
        // La marca sube desde abajo: continua el movimiento que dejo el precio.
        .to('#marca', {y: 0, scale: 1, opacity: 1, duration: 0.46, ease: 'power3.out'}, 2.10)
        .to('#bajada-marca', {y: 0, opacity: 1, duration: 0.34, ease: 'power2.out'}, 2.30);
      // 2,65-3,40  quieto. Nada de vibrar por vibrar.
    </script>
  </body>
</html>
